<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Span</title>
</head>
<body>
    <h2>Rowspan & Colspan</h2>
    <table border="2">
        <thead>
            <tr>
                <th>Language</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            <tr>
               <td rowspan="3">Web Design</td>
               <td>HTML</td> 
            </tr>
            <tr>
                <td>CSS</td>
            </tr>
            <tr>
                <td>JavaScript</td>
            </tr>


            <tr>
                <td rowspan="4">Graphics Design</td>
                <td>Adobe Photoshop</td>
            </tr>
            <tr>
                <td>Canvas</td>
            </tr>
            <tr>
                <td>Instrulator</td>
            </tr>
            <tr>
                <td>Figma</td>
            </tr>

            <tr>
                <td rowspan="2">Structre</td>
                <td>HTML</td>
            </tr>
            <tr>
                <td>CSS</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
