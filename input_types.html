<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Types</title>
</head>
<body>
    <h2>All Input Types Type in HTML</h2>

    <form>
        <label>First Name</label>
        <input type="text" placeholder="Enter First Name"/>
        <br><br>
        <label>Last Name</label>
        <input type="text" placeholder="Enter Last Name"/>
        <br><br>
        <label>Email ID</label>
        <input type="text" placeholder="Enter Email"/>
        <br><br>
        <label>Enter Fax Number</label>
        <input type="number" placeholder="Enter Fax Number"/>
  
        <br><br>
        <!-- Types of Date and Time input types -->
        <label>Select DOB</label>
        <input type="date"/>
        <label>Select Month</label>
        <input type="month"/>
        <label>Select Week</label>
        <input type="week"/>
        <br><br>
        <label>Date and Time</label>
        <input type="datetime-local"/>

        <label>Select Time</label>
        <input type="time"/>
        
        <br><br>
        <!-- Types of selection button -->
        <label>Choose City</label>
        <input type="checkbox" checked> Mumbai
        <input type="checkbox"> Pune
        <input type="checkbox"> Jalgaon
        <input type="checkbox"> Nashik
        <br><br>
        <label>Select Gender</label>
        <input type="radio" name="gender"/> Male
        <input type="radio" name="gender"/> FeMale
        <input type="radio" name="gender"/> Others 
        <br><br>

        <label>Select Color</label>
        <input type="color"/>

        <label>Select Range</label>
        <input type="range"/>
        <!-- To select single files -->
        <label>Upload Docs</label>
        <input type="file"/>
        <!-- To select multiple files -->
        <label>Upload Docs</label>
        <input type="file" multiple> 
        <br><br>

        <label>Enter Pasword</label>
        <input type="password" placeholder="Enter Password"/>

        <label>Search</label>
        <input type="search" placeholder="Enter to search..."/>
        <br><br>
        <label>Enter url</label>
        <input type="url" placeholder="http://example.com"/>

        <label>Enter Phone Number</label>
        <input type="tel" placeholder="Enter Phone Number"/>
        <br><br>

        <label>Select Country</label>
        <select>
            <option>Choose...</option>
            <option>India</option>
            <option>USA</option>
            <option>IreLand</option>
            <option>Nepal</option>
        </select>
        <br><br>

        <label>Address</label><br>
        <textarea rows="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit"/>
        <input type="button" value="Submit"/>
        <input type="reset" value="Reset"/>
        <br>
    </form>
</body>
</html>
