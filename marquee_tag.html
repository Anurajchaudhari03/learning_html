<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee tag</title>
</head>
<body>
    <h1><marquee direction="right" behaviour="alternate" bgcolor="red" scrolldelay="200">Welcome to TechZone</marquee></h1>
    <br>
            <!-- marquee tag -->
             <h1><marquee scrollamount="10">Welcome to TechZone</marquee></h1>      
             <!-- marquee tag -->
    <br>    
                <!-- marquee tag -->
            <h1><marquee direction="up" height="400px" bgcolor="yellow">Welcome to TechZone</marquee></h1>
            <!-- marquee tag -->
    <br>
                <!-- marquee tag -->
            <h1> <marquee direction="down" height="400px" bgcolor="skyblue">Welcome to TechZone</marquee> </h1>
            <!-- marquee tag -->
    <br>
             
</body>
</html>
